<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Junto · A Lista</title>
<link rel="stylesheet" href="estilo.css">
<style>
:root{--acento:#7C8CFF;--acento-t:#0E1020}
.amigo{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left;transition:background .15s;position:relative}
.amigo:hover{background:var(--camada1)}.amigo:active{background:var(--camada2)}
.amigo .acao{opacity:0;transition:opacity .15s;color:var(--t2)}.amigo:hover .acao,.amigo:focus-visible .acao{opacity:1}
.amigo .l2{display:flex;align-items:center;gap:4px;color:var(--t2);font-size:13px;line-height:20px;min-width:0}
.rodape{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;border-top:1px solid var(--borda);background:var(--camada1)}
.mini-play{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 8px 0 12px;background:var(--camada2);border-top:1px solid var(--borda2);width:100%;text-align:left;transition:background .15s}
.mini-play:hover{background:var(--camada3)}
.cabs{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px}
.capa-a{width:112px;height:112px;border-radius:12px;flex:none}
.bloco{display:flex;gap:16px;padding:0 16px 12px}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 12px}
.ctl .grande{width:48px;height:48px;border-radius:50%;background:var(--t1);color:#10121A;display:grid;place-items:center;transition:transform .1s}
.ctl .grande:active{transform:scale(.94)}.ctl .grande:disabled{opacity:.35;cursor:not-allowed}
</style></head><body><div id="raiz"></div>
<script src="motor.js"></script><script src="sessao-comum.js"></script><script>
const {ic,av,eq,achar,AMIGOS,S,dica,hms,podeControlar}=M;
function linha(a){
  const of=a.tipo;
  return `<button class="amigo" data-lista data-act="${of?'conectar:'+a.id:'menu:'+a.id}" data-menu="${a.id}" ${of?dica(a.nome,'Clique: conectar · Botão direito: mais opções'):dica(a.nome,a.est==='on'?'Online, sem nada disponível':'Offline')}>
   ${av(a,40)}
   <span class="corta" style="flex:1"><span class="corta" style="display:block;font-weight:600;${a.est==='off'?'color:var(--t3)':''}">${a.nome}</span>
   ${of?`<span class="l2">${ic(a.tipo==='ver'?'tela':'fones',14)}<span class="corta">${a.titulo}</span></span>`:`<span class="l2 fra" style="color:var(--t3)">${a.est==='on'?'Sem nada disponível':'Offline'}</span>`}</span>
   ${of?`<span class="selo acao">Conectar</span>`:''}
  </button>`}
function rodape(){return `${S.conn&&S.tela!=='sessao'?miniPlay():''}<div class="rodape">${av(M.EU,32,false)}<span class="corta" style="flex:1;font-weight:600;padding-left:8px">finjackin</span>
  <button class="btn ${S.oferecendo?'':'pri'}" style="height:36px;padding:0 12px" data-act="${S.oferecendo?'parar-oferta':'camada:oferecer'}" ${S.oferecendo?dica('Parar de disponibilizar','Quem está conectado volta para a lista'):dica('Disponibilizar','Escolha o que seus amigos podem ouvir ou ver')}>${S.oferecendo?eq()+'Disponibilizando':ic('mais',16)+'Disponibilizar'}</button>
  <button class="ibtn" data-act="camada:amigos" ${dica('Adicionar amigos')}>${ic('add')}</button>
  <button class="ibtn" data-act="camada:opcoes" ${dica('Opções')}>${ic('ajustes')}</button></div>`}
function miniPlay(){const a=achar(S.conn);return `<button class="mini-play" data-act="sessao" ${dica('Abrir sessão')}><span class="mini arte a${a.arte}"></span><span class="corta" style="flex:1"><span class="corta" style="display:block;font-weight:600">${a.titulo}</span><span class="fra corta" style="display:block;font-size:12px;line-height:16px">com ${a.nome}</span></span>${eq(!S.tocando)}<span style="width:12px"></span></button>`}
M.iniciar({
 principal(s){
  if(s.vazio)return `<div class="centro entra"><span style="color:var(--t3)">${ic('pessoas',40)}</span><div class="tit">Sua lista está vazia</div><div class="sub">Peça o nome de usuário do Discord de um amigo para adicionar.</div><button class="btn pri" data-act="camada:amigos" ${dica('Adicionar amigos')}>${ic('add',18)}Adicionar amigos</button></div>${rodape()}`;
  const of=AMIGOS.filter(a=>a.tipo),on=AMIGOS.filter(a=>!a.tipo&&a.est==='on'),off=AMIGOS.filter(a=>a.est==='off');
  return `<div class="rola entra"><div class="sec"><span>Disponibilizando</span><span>${of.length}</span></div>${of.map(linha).join('')}
   <div class="sec"><span>Online</span><span>${on.length}</span></div>${on.map(linha).join('')}
   <div class="sec"><span>Offline</span><span>${off.length}</span></div>${off.map(linha).join('')}</div>${rodape()}`},
 sessao(s){const a=achar(s.conn),c=podeControlar();
  return `<div class="cabs"><button class="ibtn" data-act="inicio" ${dica('Voltar à lista','O som continua. Esc')}>${ic('voltar')}</button><span class="corta" style="flex:1;font-weight:600">Com ${a.nome}</span>
   <button class="btn" style="height:32px;padding:0 12px" data-act="desconectar" ${dica('Sair da sessão','Para de tocar no seu PC')}>Sair</button></div>
  <div class="rola entra">
   <div class="bloco"><span class="capa-a arte a${a.arte}"></span><div class="corta" style="flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center"><div class="tit" style="white-space:normal">${a.titulo}</div><div class="sub corta">${a.sub}</div><div style="margin-top:4px;display:flex;align-items:center;justify-content:space-between">${M.gente(a)}</div></div></div>
   <div style="padding:0 16px"><div class="barra-p"><i data-pos style="width:${s.pos/a.dur*100}%"></i></div><div class="tempo"><span data-t1>${hms(s.pos)}</span><span>${hms(a.dur)}</span></div></div>
   <div class="ctl"><button class="ibtn" ${c?'':'disabled'} data-act="noop" ${dica('Voltar')}>${ic('ant')}</button><button class="grande" ${c?'':'disabled'} data-act="tocar" ${dica(s.tocando?'Pausar':'Tocar',c?'Espaço':'Só o dono controla')}>${ic(s.tocando?'pausa':'play',22)}</button><button class="ibtn" ${c?'':'disabled'} data-act="noop" ${dica('Próxima')}>${ic('prox')}</button></div>
   <div style="padding:0 16px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between">${M.seloModo(a)}${a.tipo==='ver'?`<button class="btn" style="height:32px;padding:0 12px" data-act="ver-video" ${dica('Abrir vídeo','Abre em outra janela')}>${ic('tela',16)}Ver vídeo</button>`:`<span class="selo">${ic('fones',14)}Só som</span>`}</div>
   ${M.faixaEstado()?`<div style="padding:0 16px 12px">${M.faixaEstado()}</div>`:''}
   <div class="sec" style="padding-top:4px"><span>Fila</span><span>${a.fila.length}</span></div>${M.linhasFila(a)}
  </div><div style="padding:12px 16px;border-top:1px solid var(--borda);flex:none">${M.adicionar()}</div>`},
 agir(c){if(c==='ver-video')S.tela='video'},
 esc(s){s.tela='principal'}
});
</script></body></html>
